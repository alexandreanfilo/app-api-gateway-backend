# Collector minimo para desenvolvimento: recebe OTLP e imprime no console.
# Em producao, troque o exporter `debug` pelo backend real (Tempo, Jaeger,
# Datadog) sem tocar na aplicacao -- ela so conhece OTEL_EXPORTER_OTLP_ENDPOINT.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
