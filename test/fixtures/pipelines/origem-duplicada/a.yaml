id: primeiro
name: Primeiro a consultar a origem
client: verificacao
source:
  kind: http-poll
  schedule: "*/5 * * * *"
  url: https://origem.exemplo.com/api/itens
  itemsPath: dados
  auth: { kind: api-key, header: X-Authorization, value: { secret: TOKEN_A } }
dedupe: { fields: [id] }
transform: { id: { from: id } }
destinations:
  - id: destino
    url: https://destino.exemplo.com/eventos
