id: segundo
name: Segundo pipeline na MESMA rota
client: outro-parceiro
source:
  kind: http-endpoint
  # Mesma rota do a-primeiro.yaml, escrita sem o prefixo: a normalizacao precisa
  # enxergar que sao a mesma coisa.
  path: eventos
  auth:
    kind: static-token
    value: { secret: TOKEN_B }
dedupe:
  fields: [id]
  onMissing: reject
transform:
  id: { from: id }
destinations:
  - id: destino
    url: https://destino.exemplo.com/eventos
